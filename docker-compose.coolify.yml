services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    exclude_from_hc: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/app
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/app
      FRONTEND_URL: ${FRONTEND_URL:?}
      TRUSTED_ORIGINS: ${FRONTEND_URL:?}
      BETTER_AUTH_URL: ${PUBLIC_API_URL:?}
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_BASE64_64_PROVIDER_CREDENTIAL}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  import-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "dist/import-worker.js"]
    restart: unless-stopped
    stop_grace_period: 4m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/app
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_BASE64_64_PROVIDER_CREDENTIAL}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      FIRECRAWL_CREDIT_LIMIT_MONTHLY: ${FIRECRAWL_CREDIT_LIMIT_MONTHLY:-500}
      OPENAI_IMPORT_LIMIT_MONTHLY: ${OPENAI_IMPORT_LIMIT_MONTHLY:-100}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');if(Date.now()-Number(fs.readFileSync('/tmp/house-tracker-worker-heartbeat','utf8'))>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:?}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:?}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  pgdata:
