name: CI and development deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: house_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d house_tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/house_tracker_test
      DATABASE_URL: postgresql://test:test@localhost:5432/house_tracker_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
      - run: npm run test:e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Coolify accepts the deployment-only `exclude_from_hc` key, while the
      # stock Compose schema does not. Both files build the same Dockerfiles.
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.yml build

  deploy-dev:
    needs: [quality, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      DEPLOY_BASE_DOMAIN: ${{ vars.DEPLOY_BASE_DOMAIN }}
      COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.PROVIDER_CREDENTIAL_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile and deploy exact commit
        run: node scripts/coolify.mjs
